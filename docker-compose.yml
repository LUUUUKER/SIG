# 概览 / Overview:
#   本地开发用的服务编排。一条 `docker compose up -d` 启动两个容器：
#   Local development services. `docker compose up -d` starts two containers:
#   - db:      PostgreSQL 16 + pgvector 扩展（事件去重要用向量相似度）；数据存在 pgdata 数据卷，删容器不丢数据。
#              PostgreSQL 16 with pgvector (for event de-duplication); data lives in the pgdata volume.
#   - backend: FastAPI 服务，等 db 健康检查通过后才启动；在 Compose 内网里用服务名 "db" 访问数据库。
#              FastAPI service; starts only after db is healthy; reaches the database via hostname "db".
#   前端开发阶段不进容器，直接 `pnpm dev`（见 CLAUDE.md）。/ The frontend runs natively with `pnpm dev`.
#   端口只绑定 127.0.0.1，不对局域网开放。/ Ports bind to 127.0.0.1 only.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

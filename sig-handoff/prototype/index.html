function headlineMarkup(){const items=headlineTopics.map(category=>stories.find(item=>item.cat===category&&item.type==='新闻'&&item.edition===currentEdition)).filter(Boolean);return `<section class="headlines" aria-label="七个领域头版轮播" aria-roledescription="轮播"><div class="headline-track" id="headlineTrack">${items.map((item,index)=>`<article class="hero headline-slide" aria-label="${index+1} / ${items.length} ${item.cat}" aria-roledescription="幻灯片"><div class="hero-art"></div><div class="hero-copy"><div class="meta"><span class="tag">${item.cat} / 本期头版</span><span>${item.time}</span><span>演示</span></div><h2>${item.title}</h2><p>${item.summary}</p><div class="hero-actions"><button class="filled" data-open="${item.id}">阅读全文 →</button><a href="${item.url}" target="_blank" rel="noopener noreferrer">阅读来源 ↗</a></div></div></article>`).join('')}</div><div class="headline-controls"><div class="headline-topics" aria-label="选择头版领域">${items.map((item,index)=>`<button data-slide="${index}" aria-label="查看${item.cat}头版" aria-pressed="${index===0}" class="${index===0?'active':''}">${item.cat}</button>`).join('')}</div><div class="headline-playback"><span id="headlineCount">01 / ${String(items.length).padStart(2,'0')}</span><button id="headlinePrev" aria-label="上一条头版">←</button><button id="headlinePlay" aria-label="暂停自动播放">暂停</button><button id="headlineNext" aria-label="下一条头版">→</button></div></div></section>`;}
// 初始化轮播 / Initialize rotation: attach local controls; advance every 8s, pause on hover, keyboard focus, hidden tab and reduced motion; horizontal touch scrolling remains native.
function startHeadlines(){const track=document.getElementById('headlineTrack');if(!track)return;const root=track.closest('.headlines');const slides=[...track.children];const tabs=[...root.querySelectorAll('[data-slide]')];const play=document.getElementById('headlinePlay');const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');let paused=reduced.matches;let index=0;
function sync(){index=Math.max(0,Math.min(slides.length-1,Math.round(track.scrollLeft/track.clientWidth)));tabs.forEach((tab,i)=>{tab.classList.toggle('active',i===index);tab.setAttribute('aria-pressed',String(i===index));slides[i].inert=i!==index;});document.getElementById('headlineCount').textContent=String(index+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');}
function move(next){index=(next+slides.length)%slides.length;track.scrollTo({left:index*track.clientWidth,behavior:reduced.matches?'instant':'smooth'});}
function updatePlayback(){play.textContent=paused?'播放':'暂停';play.setAttribute('aria-label',paused?'开始自动播放':'暂停自动播放');}
tabs.forEach(tab=>tab.onclick=()=>{paused=true;updatePlayback();move(Number(tab.dataset.slide));});document.getElementById('headlinePrev').onclick=()=>{paused=true;updatePlayback();move(index-1);};document.getElementById('headlineNext').onclick=()=>{paused=true;updatePlayback();move(index+1);};play.onclick=()=>{paused=!paused;updatePlayback();};track.addEventListener('scroll',sync,{passive:true});track.addEventListener('pointerdown',()=>{paused=true;updatePlayback();});updatePlayback();sync();headlineTimer=setInterval(()=>{if(!paused&&!document.hidden&&!root.matches(':hover')&&!root.contains(document.activeElement))move(index+1);},8000);}

// 转义文本 / Escape text. Input: arbitrary string. Output: safe HTML text via character replacement.
function escapeText(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

`<section class="activity event-card"><div class="datebox">${String(i+1).padStart(2,'0')}<span>探索方向</span></div><div><div class="meta"><span class="tag">${item.cat}</span><span>分类示例</span></div><h4>${item.title}</h4><p>${item.body}</p><p>实际活动将展示：日期与时间 · 场地与距离 · 票价 · 官方链接</p></div><button data-prompt="我想关注近期${item.cat}">和 AI 聊聊 ↗</button></section>`).join('')}`;}

function renderFeed(){stopHeadlines();document.documentElement.dataset.edition=currentEdition;updateGreeting();currentArticle=null;document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('active',b.dataset.cat===currentCategory));const evening=currentEdition==='evening';let list=stories.filter(s=>(currentTab==='精选文章'||s.edition===currentEdition)&&s.type===currentTab);if(currentCategory==='收藏')list=stories.filter(s=>saved.has(s.id));else if(currentCategory==='AI + GitHub')list=list.filter(s=>['AI','GitHub'].includes(s.cat));else if(!['全部','活动'].includes(currentCategory))list=list.filter(s=>s.cat===currentCategory);const heading=currentCategory==='全部'?(evening?'晚间精选':'晨间精选'):currentCategory==='收藏'?'值得再读一遍。':currentCategory==='活动'?'在屏幕之外，发现生活。':currentCategory+'，值得深读。';const showHeadlines=currentCategory==='全部'&&currentTab==='新闻';main.innerHTML=`${currentCategory==='全部'?'':`<div class="compact-heading"><h1>${currentCategory==='收藏'?'稍后阅读':currentCategory==='活动'?'近期活动':currentCategory}</h1></div>`}${showHeadlines?headlineMarkup():''}${currentCategory==='活动'?activityMarkup():`<div class="subtabs"><button data-tab="新闻" class="${currentTab==='新闻'?'active':''}">新闻</button><button data-tab="精选文章" class="${currentTab==='精选文章'?'active':''}">精选文章</button><button data-tab="名人动态" class="${currentTab==='名人动态'?'active':''}">名人动态</button></div>${list.length?list.map(storyRow).join(''):`<div class="empty">${currentCategory==='收藏'?'还没有收藏。点击新闻旁的 ◇ 即可加入。':'这个分类暂无演示条目。试试其他领域或切换早晚报。'}</div>`}`}${currentCategory==='全部'?activityMarkup():''}`;setReadingContext(currentCategory==='活动'?'近期活动 · '+activityFilters.location+' · '+activityFilters.radius+' miles':currentCategory+' · '+currentTab+' · '+(evening?'晚间版':'晨间版'));main.scrollTop=0;if(showHeadlines)startHeadlines();}
// 打开详情 / Open article. Input: existing story id. Output: detail view and corresponding chat context.
function openArticle(id){stopHeadlines();const s=stories.find(x=>x.id===id);if(!s)return;currentArticle=s;main.innerHTML=`<article class="detail"><button class="back" data-back>← 返回精选</button><div class="meta"><span class="tag">${s.cat} / ${s.type}</span><span>${s.time}</span><span>专题演示</span></div><h1>${s.title}</h1><p class="lede">${s.summary}</p><h3>重点摘要</h3><p>${s.body||'本页用于展示新闻详情的层次与排版。正式版将从原始资料提取重点，核实发布时间、事件状态与适用范围；不会把未经验证的信息写成已发生的事实。'}</p><div class="analysis-box"><h3>AI 分析与评价</h3><p>${s.analysis||'一个有用的解读，应先说明证据能够支持什么，再讨论可能的影响。将事实、不同观点与分析分开，让你既能快速理解，也能回到来源作出自己的判断。'}</p></div><h3>还值得追问什么？</h3><p>${s.watch||'这件事与之前的进展有什么不同？哪些说法有原始资料支持？如果出现新的证据，我们的判断需要怎样改变？这些问题都可以在右侧继续讨论。'}</p><div class="sources"><a href="${s.url}" target="_blank" rel="noopener noreferrer">打开原始参考资料 ↗</a><button data-discuss="${s.id}">围绕这篇继续聊 →</button></div><p style="font-size:11px;margin-top:35px">演示说明：本文为设计样稿，不是实时报道；链接指向相关参考页面。</p></article>`;setReadingContext(s.title);main.scrollTop=0;if(window.matchMedia('(max-width:950px)').matches)window.scrollTo({top:0,behavior:'instant'});}

function sendMessage(text){text=text.trim();if(!text)return;addMessage(text,'user');document.getElementById('chatInput').value='';resizeChatInput();let response;if(/只看.*AI|只看.*GitHub/i.test(text)){const previous=currentCategory;currentCategory='AI + GitHub';currentTab='新闻';renderFeed();response='已将当前列表筛选为 AI 和 GitHub。这是本次预览的临时调整，不改变长期偏好。';showToast('已筛选 AI + GitHub',()=>{currentCategory=previous;renderFeed();});}else if(/音乐|周末|活动|Jazz|演出|比赛|社交|展览|放映/i.test(text)){currentCategory='活动';activityCategory=['演出','比赛','社交活动','展览与放映'].find(category=>text.includes(category))||'全部';renderFeed();response='可以。默认查找洛杉矶市中心周边 60 miles 内，从当前时间起未来一个日历月的活动；包括演出、比赛、社交活动和展览。正式版会核实活动地点、时间及票务状态。\n\n当前是界面预览，没有执行活动搜索。你可以先看看中间的活动展示方式。';}else if(currentArticle){response='我们正在讨论「'+currentArticle.title+'」。\n\n'+(currentArticle.analysis||'可以从事实依据、背景和潜在影响三个角度展开，并比较原始资料中的不同观点。')+'\n\n这是预设回复示例；正式版会结合本文与实际问题回答。';}else{response='建议从本期头条开始：先读重点摘要，再看看 AI 分析，最后打开来源判断依据。\n\n你可以点击新闻进入详情，也可以试着说“只看 AI 和 GitHub”，体验通过对话调整页面。\n\n当前回复为交互演示，尚未连接 GPT。';}addMessage(response,'assistant');}

document.getElementById('brand').onclick=e=>{e.preventDefault();currentCategory='全部';renderFeed();};document.getElementById('chatForm').onsubmit=e=>{e.preventDefault();sendMessage(document.getElementById('chatInput').value);};document.getElementById('chatInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage(e.target.value);}};document.getElementById('clearChat').onclick=()=>{document.getElementById('messages').innerHTML='<div class="assistant-label">YOUR PERSONAL EDITOR</div><div class="message assistant">对话已重置。想从哪条新闻开始？</div>';};document.getElementById('mobileChat').onclick=()=>{const open=document.getElementById('chat').classList.toggle('open');document.getElementById('mobileChat').textContent=open?'收起聊天':'和 sig 聊聊';};renderFeed();

// 面板显隐 / Panel visibility. Input: desired open state; output: responsive panel, ARIA state and preserved draft.
// Desktop releases the reading width; small screens use an overlay. Focus returns to the toggle when closing.
function setChatVisible(open){document.body.classList.toggle('chat-hidden',!open);document.getElementById('chat').classList.toggle('open',open);const toggle=document.getElementById('panelToggle');toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'隐藏 sig 助手':'显示 sig 助手');if(open)resizeChatInput();else toggle.focus();}
// 输入自适应 / Auto-size composer. Input: current text; output: 26–144px textarea, internal scrolling beyond the cap.
// Reset height before measuring so deleting or sending text also shrinks the field.
function resizeChatInput(){const input=document.getElementById('chatInput');input.style.height='26px';const height=Math.max(26,input.scrollHeight);input.style.height=Math.min(144,height)+'px';input.style.overflowY=height>144?'auto':'hidden';}
const chatViewport=window.matchMedia('(min-width:951px)');
setChatVisible(chatViewport.matches);
chatViewport.addEventListener('change',event=>setChatVisible(event.matches));
document.getElementById('panelToggle').onclick=()=>setChatVisible(document.getElementById('panelToggle').getAttribute('aria-expanded')!=='true');

document.getElementById('chatInput').addEventListener('input',resizeChatInput);
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&document.getElementById('chat').contains(document.activeElement))setChatVisible(false);});
</script></body></html>
